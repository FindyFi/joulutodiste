<!DOCTYPE html>
<html lang="fi">
    <head>
        <meta charset="utf-8">
        <title>Pukin tarkastussovellus</title>
        <meta name="description" content="Pnko lapsi ollut kiltti?">
        <meta name="author" content="Findynet">
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" href="favicon.png">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="HandheldFriendly" content="True">
        <meta name="MobileOptimized" content="width">
        <meta name="theme-color" content="#0d0342">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Pukin tarkastussovellus">
        <meta property="og:url" content="https://joulu.todiste.fi/pukki.html">
        <meta property="og:image" content="https://joulu.todiste.fi/favicon.png">
        <meta property="og:description" content="Tarkasta, onko lapsi ollut kiltti.">
        <script src="qrcode.min.js"></script>
        <script src="https://unpkg.com/translate-element/translate-element.js"></script>
    </head>
    <body>
        <translate-element src="./translations.json"></translate-element>
        <div id="laatikko">
            <img class="logo" src="favicon.png" alt="Findynet">
            <div id="qrcode"></div>
        </div>
        <h1 lang="fi">Pukin tarkastussovellus</h1>
        <div id="ohje">
            <p lang="fi">Pyydä lasta esittämään kiltteystodisteensa. Luo jokaista lasta varten uusi todistepyyntö alla olevalla painikkeella.</p>
        </div>
        <form id="form">
            <input type="hidden" name="protocol" id="protocol" value="OPENID4VP_FINAL1">
            <button type="button" id="muodosta"><span lang="fi">Muodosta todistepyyntö</span></button>
        </form>
        <footer>
            <p lang="fi">Hauskaa joulua ja rauhallista uutta vuotta!</p>
        </footer>
        <script>
            STAR_COUNT = Math.floor((Math.random() * 10) + 5)
            var qrcode = new QRCode("qrcode", { width: 256, height: 256 });

            const f = document.getElementById('form')
            const o = document.getElementById('ohje')
            const instructions = o.innerHTML
            const l = document.getElementById('laatikko')
            let currentId = null
            let interval = null

            const query = new URLSearchParams(window.location.search);
            query.forEach((value, key) => {
                const element = document.querySelector(`[name="${key}"]`)
                if (element) {
                    element.value = value
                }
            })
            document.getElementById('muodosta').addEventListener('click', async () => {
                const verifyUrl = '/verify'
                const verifyParams = {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    // body: new URLSearchParams(new FormData(f))
                    // body: new FormData(f)
                    body: JSON.stringify({
                        protocol: document.getElementById('protocol').value
                    })
                }
                const response = await fetch(verifyUrl,  verifyParams)
                const respJson = await response.json()
                if (!respJson.url || !respJson.id) {
                    o.innerHTML = '<p lang="fi">Oho! Jotain meni pieleen...</p>'
                }
                else {
                    currentId = respJson.id
                    qrcode.makeCode(respJson.url)
                    l.classList.toggle('avattu')
                    const back = document.createElement('a')
                    back.lang = 'fi'
                    back.textContent = "Palaa"
                    back.className = 'back'
                    back.onclick = () => { 
                        l.classList.toggle('avattu')
                        f.style.display = 'block'
                        o.innerHTML = instructions
                    }
                    const status = document.createElement('p')
                    status.id = 'status'
                    status.textContent = '.'
                    o.innerHTML = '<p lang="fi">Skannaa QR-koodi lompakkosovelluksella.</p>'
                    o.appendChild(status)
                    o.appendChild(back)
                    const qrDiv = document.getElementById('qrcode')
                    const img = qrDiv.querySelector('img')
                    if (img) {
                        const a = document.createElement('a')
                        a.href = respJson.url
                        qrDiv.appendChild(a)
                        a.appendChild(img)
                    }
                    f.style.display = 'none'
                    interval = setInterval(checkStatus, 3000)
                }
            })
/*
            let stars = 0
            while (stars < STAR_COUNT) {
                const img = document.createElement('img')
                img.src = './star.svg'
                img.className = 'star'
                img.style.opacity = 0
                img.style.left = Math.floor((Math.random() * 80) + 10) + '%'
                img.style.top = Math.floor((Math.random() * 50) + 10) + '%'
                img.style.animationDelay = Math.floor(Math.random() * STAR_COUNT * 2 * 1000) + 'ms'
                document.body.appendChild(img)
                stars++
            }
*/
            async function checkStatus() {
                const s = document.getElementById('status')
                const resp = await fetch(`/status/${encodeURIComponent(currentId)}`)
                if (!resp.ok) {
                    clearInterval(interval)
                    o.innerHTML = '<p lang="fi">Oho! Jotain meni pieleen...</p>'
                    l.classList.remove('avattu')
                    f.style.display = 'block'
                    o.innerHTML = instructions
                    console.error('Error fetching status')
                    return
                }
                const status = await resp.json()
                if (status.state == 'ACCEPTED') {
                    clearInterval(interval)
                    const claims = status.proofInputs?.at(0)?.claims
                    if (!claims) {
                        s.innerHTML = '<p lang="fi">Oho! Jotain meni pieleen...</p>'
                        console.error('No claims in accepted proof')
                        return
                    }
                    const values = {}
                    claims.forEach(claim => {
                        values[claim.path] = claim.value
                    })
                    s.innerHTML = '<p>' + escapeHtml(values.Etunimi) + " " + escapeHtml(values.Sukunimi) + 
                        ' <span lang="fi">on ollut kiltti</span>: ' +
                        '<strong lang="fi">' + (values.Kiltti === "true" ? 'Kyllä' : 'Ei') + '!</strong></p>'
                    return
                }
                if (status.state == 'REJECTED') {
                    clearInterval(interval)
                    o.textContent = "Lapsi ei halunnutkaan näyttää todistetta..."
                    return
                }
                if (status.state == 'PENDING') {
                    s.textContent += "."
                    return
                }
                console.log('Status response:', status)
            }

            const escapeHtml = str => {
                return str
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
            };
        </script>
    </body>
</html>
